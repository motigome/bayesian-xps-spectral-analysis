name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[tutorial,test]"
      - name: Test Core, CLI, and tutorial contracts
        run: python -m pytest -q
      - name: Smoke-test both tutorials
        env:
          BAYES_XPS_FAST: "1"
          MPLBACKEND: Agg
        run: |
          python tutorials/01_linear_model/linear_model_bayesian_inference.py
          python tutorials/02_xps_spectral_decomposition/xps_spectral_decomposition.py
      - name: Verify smoke tests leave tracked files unchanged
        run: git diff --exit-code
